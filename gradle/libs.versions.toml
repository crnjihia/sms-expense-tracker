# path: gradle/libs.versions.toml
[versions]
# Kotlin and Android Gradle Plugin
kotlin = "2.0.0"
agp = "8.5.0"
# Compose & Material 3 (use 2024 stable releases)
compose = "2024.10.00"
material3 = "2024.10.00"
# Dependency versions
hilt = "2.51"
hilt-android-gradle-plugin = "2.51"
room = "2.6.1"
lifecycle = "2.8.0"
navigation = "2.7.7"
coroutines = "1.8.0"
# Lint & formatting
detekt = "1.23.6"
ktlint = "12.1.1"
# AndroidX core libs
androidx-core-ktx = "1.13.1"
androidx-appcompat = "1.7.0"
androidx-activity-compose = "1.9.0"
androidx-compose-ui = "1.7.0"
androidx-compose-material3 = "1.3.1"
androidx-navigation-compose = "2.7.7"
androidx-lifecycle-runtime-ktx = "2.8.0"
androidx-hilt-navigation-compose = "1.2.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose-ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-compose-material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation-compose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle-runtime-ktx" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidx-hilt-navigation-compose" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
